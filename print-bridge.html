<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091c30"><title>ARTDACI — Livre connecté</title><meta name="description" content="Passerelle officielle du livre imprimé ARTDACI vers les expériences numériques."><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#081a2d;color:#f4efe4;line-height:1.55}header,main,footer{max-width:820px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #bca16e66}a{color:#efcb86}header a{font-weight:700;text-decoration:none}small,.muted{color:#c9c5ba}main{padding-top:55px;padding-bottom:56px}h1{font:clamp(2rem,6vw,3.3rem)/1.13 Georgia,serif;margin:12px 0;color:#fff}h2{font-size:1.05rem;margin-top:32px} .eyebrow{color:#e9c68a;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem} .panel{background:#10283d;border:1px solid #ae925e66;border-radius:14px;padding:24px;margin-top:28px}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:24px}.button{display:block;border:1px solid #c8aa70;border-radius:9px;padding:14px 16px;text-decoration:none;font-weight:650;color:#fff;background:#173751}.button:hover,.button:focus{background:#31536b;outline:2px solid #d3b77e;outline-offset:2px}.note{font-size:.93rem;color:#d6cfc0}footer{border-top:1px solid #ffffff2b;color:#bdb8ab;font-size:.84rem}label{font-size:.9rem}select{background:#122d46;color:white;border:1px solid #bba16f;padding:8px;border-radius:6px}
</style></head><body><header><a href="/">ARTDACI</a><label>Langue <select id="lang"><option value="fr">FR</option><option value="en">EN</option><option value="ar">العربية</option></select></label></header><main><p class="eyebrow" id="kind"></p><h1 id="title"></h1><p class="muted" id="subtitle"></p><div class="panel"><h2 id="panel-title"></h2><p id="intro"></p><div class="links" id="links"></div><p class="note" id="note"></p></div></main><footer>ARTDACI · Printed book × Digital experiences · <a href="/">artdaci.com</a></footer>
<script>
const catalog={"artworks":[["monalisa","La Joconde","Léonard de Vinci"],["lastsupper","La Cène","Léonard de Vinci"],["ferronniere","La Belle Ferronnière","Léonard de Vinci"],["ermine","La Dame à l’hermine","Léonard de Vinci"],["ginevra","Ginevra de’ Benci","Léonard de Vinci"],["annunciation","L’Annonciation","Léonard de Vinci"],["astronomer","L’Astronome","Johannes Vermeer"],["artofpainting","L’Art de la peinture","Johannes Vermeer"],["pearlearring","La Jeune Fille à la perle","Johannes Vermeer"],["womanbalance","La Femme à la balance","Johannes Vermeer"],["viewdelft","Vue de Delft","Johannes Vermeer"],["milkmaid","La Laitière","Johannes Vermeer"],["selfportrait","Autoportrait (Orsay, 1889)","Vincent van Gogh"],["starrynight","La Nuit étoilée","Vincent van Gogh"],["bedroom","La Chambre","Vincent van Gogh"],["cafeterrace","Terrasse du café le soir","Vincent van Gogh"],["nightcafe","Le Café de nuit","Vincent van Gogh"],["sunflowers","Les Tournesols","Vincent van Gogh"],["waterlilies1916","Nymphéas (1916)","Claude Monet"],["greenharmony","Le Bassin aux nymphéas","Claude Monet"],["parasol","La Femme à l’ombrelle","Claude Monet"],["bridgeargenteuil","Le Pont d’Argenteuil","Claude Monet"],["poppies","Coquelicots","Claude Monet"],["impression","Impression, soleil levant","Claude Monet"]],"museums":[["louvre","Musée du Louvre"],["orsay","Musée d’Orsay"],["mauritshuis","Mauritshuis"],["czartoryski","Musée Czartoryski"],["vangoghmuseum","Van Gogh Museum"]]};
const segments=location.pathname.split('/').filter(Boolean);
const type=segments[0],slug=segments[1];
const item=type==='ar'?catalog.artworks.find(x=>x[0]===slug):type==='v'?catalog.museums.find(x=>x[0]===slug):null;
const text={
fr:{work:'Œuvre du livre imprimé',museum:'Musée & parcours immersifs',explore:'Prolongez votre visite',introWork:'Explorez les ressources numériques ARTDACI. Les expériences de suivi AR et les médias propres à cette œuvre seront ajoutés ici après validation technique.',introMuseum:'Accédez aux espaces muséaux et aux parcours culturels disponibles sur ARTDACI. La visite VR dédiée à ce musée sera reliée ici après validation.',collection:'Collection des œuvres',knowledge:'Graphe sémantique',vr:'Galerie VR',worlds:'Mondes virtuels',hub:'Masters Hub',note:'Cette page est une passerelle officielle. La disponibilité des fonctionnalités AR/VR propres à cette œuvre ou à ce musée n’est pas encore garantie.',unknown:'Page non référencée',unknownText:'Cette adresse ne figure pas dans le catalogue du livre.'},
en:{work:'Printed book artwork',museum:'Museum & immersive journey',explore:'Continue exploring',introWork:'Explore ARTDACI digital resources. Artwork-specific AR tracking and media will be connected here after technical validation.',introMuseum:'Explore available museum and cultural experiences. This museum’s dedicated VR tour will be linked here once validated.',collection:'Artwork collection',knowledge:'Semantic knowledge graph',vr:'VR Gallery',worlds:'Virtual Worlds',hub:'Masters Hub',note:'This is an official gateway. Artwork- or museum-specific AR/VR features are not yet guaranteed.',unknown:'Page not in catalogue',unknownText:'This address is not listed in the printed book catalogue.'},
ar:{work:'عمل فني من الكتاب المطبوع',museum:'المتحف والتجارب الغامرة',explore:'تابع الاستكشاف',introWork:'استكشف موارد ARTDACI الرقمية. ستضاف تجارب الواقع المعزز المخصصة للعمل بعد التحقق التقني.',introMuseum:'استكشف التجارب المتحفية المتاحة. ستضاف الجولة الافتراضية المخصصة بعد التحقق.',collection:'مجموعة اللوحات',knowledge:'المعرفة الدلالية',vr:'معرض الواقع الافتراضي',worlds:'عوالم افتراضية',hub:'ملتقى الفنانين',note:'هذه بوابة رسمية؛ لم يتم التأكد بعد من جاهزية جميع تجارب الواقع المعزز والافتراضي الخاصة.',unknown:'صفحة غير مدرجة',unknownText:'هذا العنوان غير موجود في فهرس الكتاب.'}};
function draw(){const lang=document.querySelector('#lang').value,t=text[lang],museum=type==='v';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelector('#kind').textContent=museum?t.museum:t.work;document.querySelector('#title').textContent=item?item[1]:t.unknown;document.title=(item?item[1]:'ARTDACI')+' — ARTDACI';document.querySelector('#subtitle').textContent=item?(museum?'ARTDACI':item[2]):t.unknownText;document.querySelector('#panel-title').textContent=t.explore;document.querySelector('#intro').textContent=item?(museum?t.introMuseum:t.introWork):t.unknownText;document.querySelector('#note').textContent=t.note;const links=museum?[[t.hub,'/geo/masters-hub.html'],[t.worlds,'/worlds/'],[t.vr,'/gallery-vr.html']]:[[t.collection,'/#painting-index'],[t.knowledge,'/semantic/'],[t.vr,'/gallery-vr.html']];document.querySelector('#links').replaceChildren(...links.map(([name,url])=>{const a=document.createElement('a');a.className='button';a.href=url+(url.includes('#')?'':'?lang='+lang);a.textContent=name+' ↗';return a}));}
const lang=new URLSearchParams(location.search).get('lang');if(['fr','en','ar'].includes(lang))document.querySelector('#lang').value=lang;document.querySelector('#lang').addEventListener('change',draw);draw();
</script></body></html>
