<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="application-name" content="ARTDACI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/app/artdaci-app-icon.svg" type="image/svg+xml" />
    <title>ARTDACI — VR Cinema</title>
    <link rel="stylesheet" href="styles/gallery-vr.css?v=16" />
    <script type="importmap">
      {"imports":{"three":"./vendor/three.module.js"}}
    </script>
  </head>
  <body data-experience="cinema">
    <main class="gallery-shell">
      <header class="gallery-toolbar">
        <a id="gallery-back" class="gallery-button" href="gallery-vr.html?lang=en">Back to gallery</a>
        <div>
          <p id="gallery-kicker">Immersive cinema</p>
          <h1 id="gallery-title">ARTDACI Cinema</h1>
          <p id="gallery-instructions">Choose a film, sit down, and enter VR when your headset is ready.</p>
        </div>
        <div class="gallery-toolbar-actions">
          <a id="gallery-language-switch" class="gallery-button" href="cinema-vr.html?lang=fr" lang="fr">Français</a>
          <a id="gallery-language-switch-secondary" class="gallery-button" href="cinema-vr.html?lang=ar" lang="ar">العربية</a>
          <button id="enter-gallery-vr" class="gallery-button primary" type="button" disabled>Enter VR Cinema</button>
        </div>
      </header>
      <aside class="gallery-guide">
        <strong id="gallery-count">Cinema room</strong>
        <span id="gallery-status" role="status">Preparing the cinema…</span>
        <section class="cinema-device-viewer" aria-labelledby="cinema-device-title">
          <strong id="cinema-device-title">Watch on this device</strong>
          <video id="cinema-device-player" controls playsinline preload="metadata"></video>
        </section>
        <div class="gallery-audio-controls" aria-label="Audio guide controls" hidden>
          <button id="gallery-audio-toggle" class="gallery-button" type="button">Play audio</button>
          <button id="gallery-audio-restart" class="gallery-button" type="button">Restart</button>
          <button id="gallery-audio-mute" class="gallery-button" type="button">Mute</button>
        </div>
        <div class="gallery-video-controls" aria-label="Video controls">
          <select id="gallery-video-select" class="gallery-video-select" aria-label="Choose a cinema video" disabled></select>
          <button id="gallery-video-previous" class="gallery-button" type="button" disabled>Previous</button>
          <button id="gallery-video-toggle" class="gallery-button" type="button" disabled>Play video</button>
          <button id="gallery-video-restart" class="gallery-button" type="button" disabled>Restart video</button>
          <button id="gallery-video-mute" class="gallery-button" type="button" disabled>Unmute video</button>
          <button id="gallery-video-back" class="gallery-button" type="button" disabled>−10 sec</button>
          <button id="gallery-video-forward" class="gallery-button" type="button" disabled>+10 sec</button>
          <button id="gallery-video-next" class="gallery-button" type="button" disabled>Next</button>
        </div>
        <div class="gallery-media-library" aria-label="Audio and music library">
          <label><span id="gallery-narration-label">Audio stories</span><select id="gallery-narration-select" class="gallery-video-select"></select></label>
          <div><button id="gallery-narration-previous" class="gallery-button" type="button">Previous</button><button id="gallery-narration-back" class="gallery-button" type="button">Rewind</button><button id="gallery-narration-toggle" class="gallery-button" type="button">Play audio</button><button id="gallery-narration-forward" class="gallery-button" type="button">Forward</button><button id="gallery-narration-next" class="gallery-button" type="button">Next</button><button id="gallery-narration-stop" class="gallery-button" type="button">Stop</button></div>
          <label><span id="gallery-music-label">Music</span><select id="gallery-music-select" class="gallery-video-select"></select></label>
          <div><button id="gallery-music-previous" class="gallery-button" type="button">Previous</button><button id="gallery-music-back" class="gallery-button" type="button">Rewind</button><button id="gallery-music-toggle" class="gallery-button" type="button">Play music</button><button id="gallery-music-forward" class="gallery-button" type="button">Forward</button><button id="gallery-music-next" class="gallery-button" type="button">Next</button><button id="gallery-music-stop" class="gallery-button" type="button">Stop</button></div>
        </div>
        <nav class="gallery-exit-links" aria-label="Cinema links">
          <a id="gallery-cinema-link" class="gallery-button cinema-link" href="gallery-vr.html?lang=en">Return to gallery</a>
          <a id="gallery-exit-link" class="gallery-button" href="index.html">Exit to collection</a>
        </nav>
      </aside>
      <div id="gallery-stage" aria-label="Independent virtual cinema room"></div>
      <details id="virtual-guide" class="virtual-guide">
        <summary id="virtual-guide-title">Virtual guide</summary>
        <div class="virtual-guide-body">
          <p id="virtual-guide-intro"></p>
          <label id="virtual-guide-label" for="virtual-guide-question"></label>
          <textarea id="virtual-guide-question" rows="3"></textarea>
          <div id="virtual-guide-suggestions" class="virtual-guide-suggestions"></div>
          <div class="virtual-guide-actions">
            <a id="virtual-guide-chatgpt" class="gallery-button primary" target="_blank" rel="noopener noreferrer">ChatGPT</a>
            <a id="virtual-guide-gemini" class="gallery-button" href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer">Gemini</a>
          </div>
          <small id="virtual-guide-note"></small>
        </div>
      </details>
    </main>
    <script type="module" src="scripts/gallery-vr.js?v=113"></script>
    <script src="scripts/pwa.js?v=1" defer></script>
  </body>
</html>
