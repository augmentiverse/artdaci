{id:"orsay",name:"Musée d’Orsay",city:["Paris · France","Paris · France","باريس · فرنسا"],photo:"Front view of the Musée d'Orsay.jpg",credit:"DiscoA340 · Wikimedia Commons",official:"https://www.musee-orsay.fr/",collection:"../index-fr.html#painting-index",desc:["Un musée installé dans une ancienne gare et consacré notamment aux arts de 1848 à 1914.","An art museum housed in a former railway station, especially known for art from 1848 to 1914.","متحف يقع داخل محطة قطار سابقة، ويشتهر بفنون الفترة من 1848 إلى 1914."],facts:[["Le bâtiment servait de gare pour l'Exposition universelle de 1900.","Le musée ouvre en 1986 après la transformation de la gare."],["The building was a railway station for the 1900 World's Fair.","The museum opened in 1986 after the station was transformed."],["كان المبنى محطة قطار للمعرض العالمي لعام 1900.","افتُتح المتحف عام 1986 بعد تحويل المحطة."]]},
{id:"mauritshuis",name:"Mauritshuis",city:["La Haye · Pays-Bas","The Hague · Netherlands","لاهاي · هولندا"],photo:"Plein 26, achterzijde.jpg",credit:"Hanno Lans · Wikimedia Commons",official:"https://www.mauritshuis.nl/",collection:"../index-fr.html#painting-index",desc:["Une collection de peintures néerlandaises au cœur de La Haye, dont La Jeune Fille à la perle.","Dutch master paintings in the heart of The Hague, including Girl with a Pearl Earring.","يضم روائع الرسم الهولندي، ومنها الفتاة ذات القرط اللؤلؤي."],facts:[["Le palais fut construit au XVIIe siècle pour Jean-Maurice de Nassau-Siegen.","La Jeune Fille à la perle de Vermeer est l'une de ses œuvres emblématiques."],["The building was constructed in the 17th century for Johan Maurits of Nassau-Siegen.","Vermeer's Girl with a Pearl Earring is one of its signature works."],["شُيّد المبنى في القرن السابع عشر ليوهان ماوريتس.","تعد لوحة فيرمير «الفتاة ذات القرط اللؤلؤي» من أبرز مقتنياته."]]},
{id:"czartoryski",name:"Musée des Princes Czartoryski",city:["Cracovie · Pologne","Kraków · Poland","كراكوف · بولندا"],photo:"Krakow CzartoryskiMuseum 7468.JPG",credit:"Ludvig14 · Wikimedia Commons",official:"https://mnk.pl/",collection:"../index-fr.html#painting-index",desc:["Ce musée conserve La Dame à l'hermine de Léonard de Vinci.","This museum houses Leonardo da Vinci's Lady with an Ermine.","يحتفظ هذا المتحف بلوحة «السيدة ذات الفراء» لليوناردو دافنشي."],facts:[["La collection Czartoryski fut fondée par la princesse Izabela Czartoryska en 1796.","La Dame à l'hermine est l'un des rares portraits féminins conservés de Léonard."],["Princess Izabela Czartoryska founded the collection in 1796.","Lady with an Ermine is one of Leonardo's few surviving portraits of women."],["أسست الأميرة إيزابيلا تشارتوريسكا المجموعة عام 1796.","تعد «السيدة ذات الفراء» من بورتريهات النساء القليلة الباقية لدافنشي."]]},

{id:"nga",name:"National Gallery of Art",city:["Washington D.C. · États-Unis","Washington, D.C. · United States","واشنطن العاصمة · الولايات المتحدة"],photo:"National Gallery of Art - West Building facade.JPG",credit:"Wikimedia Commons contributors",official:"https://www.nga.gov/",collection:"../index-fr.html#painting-index",desc:["Un musée national abritant notamment Ginevra de’ Benci de Léonard de Vinci.","A national museum that houses Leonardo da Vinci's Ginevra de' Benci.","متحف وطني يضم لوحة جينيفرا دي بنتشي لليوناردو دافنشي."],facts:[["Le West Building, conçu par John Russell Pope, ouvre en 1941.","Ginevra de’ Benci est le seul tableau de Léonard de Vinci conservé dans les Amériques."],["The West Building, designed by John Russell Pope, opened in 1941.","Ginevra de' Benci is the only Leonardo painting in the Americas."],["افتُتح المبنى الغربي الذي صممه جون راسل بوب عام 1941.","تعد جينيفرا دي بنتشي لوحة دافنشي الوحيدة المحفوظة في الأمريكتين."]]}

let lang=new URLSearchParams(location.search).get("lang")||"fr",idx=0;if(!labels[lang])lang="fr";
const el=id=>document.getElementById(id);
function render(){const m=museums[idx],l=labels[lang],k=["fr","en","ar"].indexOf(lang);document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";el("intro").textContent=l.intro;el("kicker").textContent=l.kicker;el("city").textContent=m.city[k];el("name").textContent=m.name;el("description").textContent=m.desc[k];el("fact1").textContent=m.facts[k][0];el("fact2").textContent=m.facts[k][1];el("photo").src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(m.photo)+"?width=1200";el("photo").alt=m.name;el("credit").textContent=m.credit;el("photoSource").href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(m.photo);el("photoSource").textContent=l.source;el("official").href=m.official;el("official").textContent=l.official;el("collection").href=lang==="en"?"../index.html#painting-index":lang==="ar"?"../index-ar.html#painting-index":m.collection;el("collection").textContent=l.collection;el("counter").textContent=(idx+1)+" / "+museums.length;el("prev").textContent=l.prev;el("next").textContent=l.next;el("footer").textContent=l.footer;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));history.replaceState(null,"","?lang="+lang+"#"+m.id)}
el("prev").addEventListener("click",()=>{idx=(idx+museums.length-1)%museums.length;render()});el("next").addEventListener("click",()=>{idx=(idx+1)%museums.length;render()});document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON","A"].includes(document.activeElement.tagName))return;if(e.key==="ArrowRight"){idx=(idx+1)%museums.length;render()}if(e.key==="ArrowLeft"){idx=(idx+museums.length-1)%museums.length;render()}});const chosen=museums.findIndex(m=>"#"+m.id===location.hash);if(chosen>=0)idx=chosen;render();
