        "answer": "يكفي متصفح حديث للعديد من الصفحات. ويتطلب الواقع المعزز المعتمد على الكاميرا جهازًا متوافقًا وإذن الوصول إليها، بينما قد تتطلب بعض وظائف الواقع الافتراضي أجهزة مناسبة."
      },
      {
        "question": "كم تبلغ تكلفة ARTDACI؟",
        "answer": "يمكنك استكشاف الموقع العام دون شراء الكتاب. ويجب تأكيد شروط شراء الكتاب وأي رسوم خاصة ببعض التجارب بشكل منفصل."
      },
      {
        "question": "ما الأعمال الفنية المتوفرة؟",
        "answer": "يقدّم ARTDACI أعمالًا لليوناردو دافنشي وفيرمير وفان غوخ ومونيه. تصفّح فهرس اللوحات للتعرف على المجموعة الحالية والتجارب المرتبطة بها."
      }
    ],
    "homeUrl": "index-ar.html"
  }
};
    const GUIDE_ICON = {
      book: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/><path d="m16 10 2 2 3-3"/></svg>',
      online: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3.5 15 0 18M12 3c3 3 3.5 15 0 18"/></svg>'
    };

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[ch]);

    const list = (items) => "<ul>" + items.map((item) => "<li>" + escapeHtml(item) + "</li>").join("") + "</ul>";
    const renderSection = (s) => {
      if (s[0] === "band") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><p>' + escapeHtml(s[2]) + '</p></section>';
      if (s[0] === "grid") return '<section class="concept-grid"><div><h2>' + escapeHtml(s[1]) + '</h2>' + (s[2] ? '<p>' + escapeHtml(s[2]) + '</p>' : '') + list(s[3]) + '</div><div><h2>' + escapeHtml(s[4]) + '</h2>' + (s[5] ? '<p>' + escapeHtml(s[5]) + '</p>' : '') + list(s[6]) + '</div></section>';
      if (s[0] === "gridText") return '<section class="concept-grid"><div><h2>' + escapeHtml(s[1]) + '</h2><p>' + escapeHtml(s[2]) + '</p></div><div><h2>' + escapeHtml(s[3]) + '</h2><p>' + escapeHtml(s[4]) + '</p></div></section>';
      if (s[0] === "modes") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><div class="mode-grid">' + s[2].map((item) => '<div><strong>' + escapeHtml(item[0]) + '</strong><span>' + escapeHtml(item[1]) + '</span></div>').join("") + '</div></section>';
      if (s[0] === "roadmap") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><ol class="roadmap">' + s[2].map((item) => '<li><strong>' + escapeHtml(item[0]) + '</strong> ' + escapeHtml(item[1]) + '</li>').join("") + '</ol></section>';
      return "";
    };

    const requested = (new URLSearchParams(location.search).get("lang") || "fr").toLowerCase().split(/[-_]/)[0];
    const lang = ["en", "fr", "ar"].includes(requested) ? requested : "fr";
    const t = COPY[lang];
    const v = VISITOR[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = v.pageTitle;
    document.getElementById("atlas-eyebrow").textContent = v.eyebrow;
    document.getElementById("atlas-title").textContent = v.title;
    document.getElementById("atlas-dek").textContent = v.dek;
    const keepFAQ = location.hash === "#faq" ? "#faq" : "";
    const switches = [["en","English"],["fr","Français"],["ar","العربية"]]
      .filter(([code]) => code !== lang)
      .map(([code,label]) => '<a href="atlas.html?lang=' + code + keepFAQ + '" lang="' + code + '"' + (code === "ar" ? ' dir="rtl"' : '') + '>' + escapeHtml(label) + '</a>').join("");
    document.getElementById("atlas-actions").innerHTML =
      '<a class="guide-home-button" href="' + v.homeUrl + '">' + escapeHtml(v.back) + '</a>' +
      '<a href="#start">' + escapeHtml(v.startLink) + '</a>' +
      '<a href="#faq">' + escapeHtml(v.faqLink) + '</a>' + switches;
    document.getElementById("guide-start").innerHTML =
      '<p class="guide-eyebrow">' + escapeHtml(v.startEyebrow) + '</p>' +
      '<h2 id="guide-start-title">' + escapeHtml(v.startTitle) + '</h2>' +
      '<p class="guide-start-lead">' + escapeHtml(v.startLead) + '</p>' +
      '<div class="guide-start-grid">' +
      v.cards.map(card => '<article class="guide-start-card"><span class="guide-step-icon" aria-hidden="true">' +
        GUIDE_ICON[card.kind] + '</span><h3>' + escapeHtml(card.title) + '</h3>' +
        '<ol>' + card.steps.map(step => '<li>' + escapeHtml(step) + '</li>').join("") + '</ol>' +
        '<a href="' + escapeHtml(card.href) + '">' + escapeHtml(card.label) + '</a></article>').join("") +
      '</div>';
    document.getElementById("faq").innerHTML =
      '<p class="guide-eyebrow">' + escapeHtml(v.faqEyebrow) + '</p>' +
      '<h2 id="guide-faq-title">' + escapeHtml(v.faqTitle) + '</h2>' +
      '<p class="guide-faq-lead">' + escapeHtml(v.faqLead) + '</p>' +
      '<div class="guide-faq-list">' +
      v.faqs.map(item => '<details class="guide-faq-item"><summary>' + escapeHtml(item.question) +
        '</summary><p>' + escapeHtml(item.answer) + '</p></details>').join("") + '</div>';
    document.getElementById("guide-concept-summary").textContent = v.conceptTitle;
    document.getElementById("atlas-content").innerHTML = t.sections.map(renderSection).join("");
    document.getElementById("guide-footer").innerHTML =
      '<p>' + escapeHtml(v.footer) + ' <a href="' + v.homeUrl + '">' + escapeHtml(v.back) + '</a></p>';
    if (location.hash === "#faq" || location.hash === "#start") {
      requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView());
    }
  </script>
</body>
</html>
