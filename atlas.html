<body>

        <div class="actions" id="atlas-actions" aria-label="Atlas navigation"></div>

      <div id="atlas-content"></div>
    </article>
  </main>

          ["grid", "Book structure", "The Atlas organizes masterpieces into a clear museum-style journey that connects artists, periods, techniques, and visual ideas.", ["Artist and artwork introductions", "Historical and artistic context", "Technique, composition, palette, and symbolism", "Timelines, comparisons, and close-looking prompts", "Connections to museums and immersive experiences"],

          ["gridText", "Personal gallery", "Beyond page scanning, spatial mode can let readers place 3D content in their own environment, compare works, enlarge details, and build a personal gallery around the printed book.",
                       "QR strategy", "QR codes complement rather than replace image tracking. They should remain discreet and provide direct access to longer videos, learning resources, spatial galleries, language options, and evolving online content."],
          ["grid", "Education", "", ["Observation questions for younger readers, students, and adults", "Guided comparisons between works, periods, and techniques", "Symbol and hidden-detail exploration", "Teacher resources and discussion prompts"],
                   "Accessibility", "", ["Audio descriptions and spoken overviews", "Subtitles for narration and video", "Readable typography and strong contrast", "Short navigation paths back to the printed-book experience"]],

            ["Extend.", "Future glasses and spatial-computing experiences with hands-free interpretation and museum guidance."]

        ]
      },
      fr: {
        pageTitle: "ARTDACI — Concept d’Atlas augmenté",
        eyebrow: "Concept éditorial · ARTDACI",

            ["AR sur image", "Le tableau imprimé devient une cible pour les modèles 3D, étiquettes, audios, vidéos et couches contextuelles."],

                   "Accessibilité", "", ["Descriptions audio et aperçus parlés", "Sous-titres pour narration et vidéo", "Typographie lisible et contraste renforcé", "Navigation courte pour revenir facilement au livre imprimé"]],

        dek: "كتاب فني بجودة كتالوجات المتاحف يعمل أولاً ككتاب مطبوع مستقل، ثم يفتح طبقة رقمية اختيارية عبر الواقع المعزز، والسرد الصوتي، والفيديو، وإعادة البناء ثلاثية الأبعاد، والوضع المكاني، والتجارب الغامرة.",
        back: "العودة إلى الفهرس",
        backUrl: "index-ar.html",
        sections: [
          ["band", "الكتاب أولاً، والسحر ثانياً", "ينبغي أن تظل كل صفحتين متقابلتين تجربة تحريرية متكاملة بذاتها: سياق تاريخي، وتحليل، وتقنية، ورمزية، وتسلسل زمني، وتفاصيل تستحق الملاحظة، وروابط بأعمال أخرى. الطبقة المعززة توسّع القراءة ولا تجعل الجهاز شرطاً للاستفادة من الكتاب."],
          ["grid", "بنية الكتاب", "ينظم الأطلس الروائع الفنية في مسار واضح يشبه زيارة المتحف ويربط بين الفنانين والفترات والتقنيات والأفكار البصرية.", ["تقديم الفنان والعمل الفني", "السياق التاريخي والفني", "التقنية والتكوين ولوحة الألوان والرمزية", "التسلسل الزمني والمقارنات وأسئلة الملاحظة", "الروابط بالمتاحف والتجارب الغامرة"],
                   "نموذج الصفحتين المتقابلتين", "يبقى العمل الفني في المركز بصرياً، بينما تقدم الصفحة المقابلة المعلومات الضرورية لفهمه وملاحظته بعناية.", ["العنوان والفنان والتاريخ والخامة والأبعاد والمتحف", "السياق التاريخي والحركة الفنية", "التكوين والألوان والتقنية والرمزية", "التفاصيل الخفية والطرائف والترميم والتأثير", "التسلسل الزمني والمقارنة مع أعمال أخرى"]],
          ["modes", "أنماط التعزيز الرقمي", [
            ["الواقع المعزز بالصورة", "تصبح اللوحة المطبوعة هدفاً تظهر فوقه النماذج ثلاثية الأبعاد والعلامات والصوت والفيديو والمعلومات السياقية."],
            ["السرد الصوتي", "تقدم الأدلة الصوتية القصيرة مدخلاً ميسراً إلى العمل من دون أن تحل محل القراءة المطبوعة."],
            ["العلامات التفاعلية", "تكشف نقاط الاهتمام المختصرة عن التكوين والتقنية والرمزية والتفاصيل الخفية."],
            ["إعادة البناء ثلاثية الأبعاد", "يمكن أن تخرج النماذج من الصفحة أو توضع بصورة مستقلة داخل مساحة القارئ."],
            ["العملية الفنية", "يمكن مستقبلاً عرض الرسم التحضيري وطبقات الطلاء والترميم والأشعة السينية وغيرها من الصور التقنية."],
            ["المتحف والزمن", "يمكن لبعض الأعمال أن تمتد إلى قاعات ومراسم ومدن وفضاءات متحفية معاد بناؤها رقمياً."]
          ]],
          ["gridText", "المعرض الشخصي", "إلى جانب مسح الصفحة، يمكن للوضع المكاني أن يسمح للقارئ بوضع المحتوى ثلاثي الأبعاد في محيطه، ومقارنة الأعمال، وتكبير التفاصيل، وبناء معرض شخصي ينطلق من الكتاب المطبوع.",
                       "استراتيجية رموز QR", "تكمل رموز QR تتبع الصورة ولا تستبدله. ويُفضّل أن تبقى بسيطة وغير مزعجة، مع توفير وصول مباشر إلى الفيديوهات الطويلة والموارد التعليمية والمعارض المكانية وخيارات اللغة والمحتوى المتجدد على الإنترنت."],
          ["grid", "التعلّم", "", ["أسئلة ملاحظة تناسب القراء الصغار والطلبة والبالغين", "مقارنات موجهة بين الأعمال والفترات والتقنيات", "استكشاف الرموز والتفاصيل الخفية", "موارد للمدرسين ومحاور للنقاش"],
                   "إتاحة الوصول", "", ["وصف صوتي وملخصات مسموعة", "ترجمة نصية للسرد والفيديو", "خط واضح وتباين بصري قوي", "تنقل بسيط يسمح بالعودة بسهولة إلى تجربة الكتاب المطبوع"]],
          ["roadmap", "مسار التطوير", [
            ["الطباعة.", "كتاب متحفي متكامل يعمل بصورة مستقلة."],
            ["التعزيز.", "تتبع الصور والسرد والعلامات والنماذج ثلاثية الأبعاد والفيديو والوصول عبر QR."],
            ["الانغماس.", "معارض مكانية وWebXR وVR وأماكن معاد بناؤها وتفاعلات أكثر ثراءً."],
            ["التوسّع.", "دعم مستقبلي للنظارات والحوسبة المكانية مع إرشاد متحفي وتفسير دون استخدام اليدين."]
          ]]

      }
    };

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[ch]);

    const list = (items) => "<ul>" + items.map((item) => "<li>" + escapeHtml(item) + "</li>").join("") + "</ul>";
    const renderSection = (s) => {
      if (s[0] === "band") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><p>' + escapeHtml(s[2]) + '</p></section>';
      if (s[0] === "grid") return '<section class="concept-grid"><div><h2>' + escapeHtml(s[1]) + '</h2>' + (s[2] ? '<p>' + escapeHtml(s[2]) + '</p>' : '') + list(s[3]) + '</div><div><h2>' + escapeHtml(s[4]) + '</h2>' + (s[5] ? '<p>' + escapeHtml(s[5]) + '</p>' : '') + list(s[6]) + '</div></section>';
      if (s[0] === "gridText") return '<section class="concept-grid"><div><h2>' + escapeHtml(s[1]) + '</h2><p>' + escapeHtml(s[2]) + '</p></div><div><h2>' + escapeHtml(s[3]) + '</h2><p>' + escapeHtml(s[4]) + '</p></div></section>';
      if (s[0] === "modes") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><div class="mode-grid">' + s[2].map((item) => '<div><strong>' + escapeHtml(item[0]) + '</strong><span>' + escapeHtml(item[1]) + '</span></div>').join("") + '</div></section>';
      if (s[0] === "roadmap") return '<section class="concept-band"><h2>' + escapeHtml(s[1]) + '</h2><ol class="roadmap">' + s[2].map((item) => '<li><strong>' + escapeHtml(item[0]) + '</strong> ' + escapeHtml(item[1]) + '</li>').join("") + '</ol></section>';
      return "";
    };

    const requested = (new URLSearchParams(location.search).get("lang") || "fr").toLowerCase().split(/[-_]/)[0];
    const lang = ["en", "fr", "ar"].includes(requested) ? requested : "fr";
    const t = COPY[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.pageTitle;
    document.getElementById("atlas-eyebrow").textContent = t.eyebrow;
    document.getElementById("atlas-title").textContent = t.title;
    document.getElementById("atlas-dek").textContent = t.dek;

    const switches = [
      ["en", "English"], ["fr", "Français"], ["ar", "العربية"]
    ].filter(([code]) => code !== lang)
      .map(([code, label]) => '<a class="button" href="atlas.html?lang=' + code + '" lang="' + code + '"' + (code === "ar" ? ' dir="rtl"' : '') + '>' + label + '</a>')
      .join("");
    document.getElementById("atlas-actions").innerHTML = '<a class="button primary" href="' + t.backUrl + '">' + t.back + '</a>' + switches;
    document.getElementById("atlas-content").innerHTML = t.sections.map(renderSection).join("");
  </script>
</body>
</html>
