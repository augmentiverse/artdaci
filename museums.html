    photoAlt: 'صورة فوتوغرافية للمتحف: ', portalEyebrow:'بوابة ثقافية مترابطة', portalTitle:'استكشف المزيد', portalIntro:'اكتشف الأعمال الفنية والتجارب الغامرة والروابط المعرفية المرتبطة بهذا المتحف.', portalTabs:['الأعمال الفنية','3D · AR · VR','المعرفة والأسئلة'], artworksDescription:'افتح أحد الأعمال المرتبطة بالمتحف في كتاب ARTDACI المتصل.', experiencesDescription:'انتقل من الجولة الفوتوغرافية إلى التجارب الغامرة المتاحة.', museumPreview:'رسم توضيحي من ARTDACI للمتحف (ليس صورة فوتوغرافية)', knowledgeTitle:'أسئلة للتعمق', knowledgeDescription:'انسخ أي سؤال لنقاش موجّه أو نشاط تعليمي.', copyQuestion:'نسخ السؤال', copied:'تم نسخ السؤال.', copyFailed:'تعذر النسخ. حدد السؤال يدويًا.', semanticOpen:'فتح ARTDACI الدلالي ↗', knowledgeNote:'سيُضاف مرشد ذكاء اصطناعي سياقي داخل المتحف في مرحلة لاحقة؛ يمكن زيارة الرسم البياني الدلالي الموجود عبر الرابط أعلاه.', selector:'اختر متحفًا'}
};

const HISTORY_UI={
  fr:{tab:'Histoire',title:'L’histoire du musée',intro:'Trois dates clés pour comprendre le lieu, son architecture et sa collection.',source:'Source institutionnelle ↗',unavailable:'Chronologie temporairement indisponible.'},
  en:{tab:'History',title:'The museum through time',intro:'Three key dates reveal the history of this place, its architecture and collection.',source:'Museum source ↗',unavailable:'Timeline temporarily unavailable.'},
  ar:{tab:'التاريخ',title:'محطات من تاريخ المتحف',intro:'ثلاثة تواريخ أساسية لفهم تاريخ المكان وعمارته ومجموعته.',source:'مصدر المتحف ↗',unavailable:'الخط الزمني غير متاح مؤقتًا.'}
};
const ARTWORK_IMAGES={
  ld01:'assets/artists/leonardo-da-vinci/artworks/mona-lisa/images/mona-lisa.jpg',
  ld02:'assets/artists/leonardo-da-vinci/collection/the-lady-with-an-ermine-davinci.webp',
  ld05:'assets/artists/paintings_images/davinci/davinci_ginevra-de-benci.png',
  ld06:'assets/artists/paintings_images/davinci/davinci_belle-ferronnière.png',
  ve01:'assets/artists/johannes-vermeer/artworks/girl-with-a-pearl-earring/images/vermeer-girl-with-a-pearl-earring.jpg',
  ve02:'assets/artists/johannes-vermeer/artworks/view_of_delft/images/ve02-view-of-delft-web.webp',
  ve05:'assets/artists/paintings_images/vermeer/vermeer_astronomer.png',
  ve06:'assets/artists/paintings_images/vermeer/vermeer_woman-holding-balance.png',
  vg01:'assets/artists/vincent-van-gogh/artworks/self-portrait/images/self-portrait-orsay-1889-v1.webp',
  vg02:'assets/artists/vincent-van-gogh/artworks/the-bedroom/images/bed-van-gogh.jpeg',
  mo02:'assets/artists/claude-monet/collection/le-pont-d-argenteuil-monet.webp',
  mo06:'assets/artists/paintings_images/monet/monet_woman-parasol.png'
};
const $ = (id) => document.getElementById(id);
const search = new URLSearchParams(location.search);
const initialLang = search.get('lang');
let lang = ['fr','en','ar'].includes(initialLang) ? initialLang : 'fr';
let index = 0;
let museums = [];
let activeTab = ['artworks','immersive','knowledge','history'].includes(search.get('tab')) ? search.get('tab') : 'artworks';
let historyByMuseum={};

function text(id, value) { $(id).textContent = value; }
function local(record) { return record?.[lang] ?? record?.fr ?? ''; }
function el(tag, className, value) {
  const item = document.createElement(tag);
  if (className) item.className = className;
  if (value !== undefined) item.textContent = value;
  return item;
}
function link(label, href, className, external=false) {
  const a = el('a', className, label);
  a.href = href;
  if (external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
  return a;
}
function internalUrl(path) {
  const url = new URL(path, location.href);
  const file = url.pathname.split('/').pop();
  // Existing ARTDACI print pages are different documents for English, French
  // and Arabic. Match their actual routes rather than silently opening EN.
  const printAliases = {
    'print-target.html': 'mona-lisa',
    'print-vermeer-girl-with-a-pearl-earring.html': 'vermeer-girl-with-a-pearl-earring',
    'print-van-gogh.html': 'van-gogh',
    'print-van-gogh-bedroom.html': 'van-gogh-bedroom'
  };
  if (printAliases[file]) {
    const slug = printAliases[file];
    if (lang === 'ar') return new URL(`print-ar.html?painting=${encodeURIComponent(slug)}`,location.href).href;
    if (lang === 'fr') url.pathname = url.pathname.replace(/\.html$/, '-fr.html');
    return url.href;
  }
  if (['print-artwork.html', 'gallery-vr.html', 'ar.html', 'space.html'].includes(file)) url.searchParams.set('lang', lang);
  return url.href;
}
function replaceState(museum) {
  const url = new URL(location.href);
  url.searchParams.set('lang',lang);
  url.searchParams.set('museum',museum.id);
  history.replaceState(null,'',url.pathname+url.search+url.hash);
}
function renderPhoto(museum) {
  const img = $('museum-photo');
  const p = museum.photo;
  img.alt = UI[lang].photoAlt + local(museum.name);
  img.onerror = null;
  img.onload = null;
  $('photo-credit').replaceChildren();
  const copyright = el('span','',`${UI[lang].photograph} : ${p.author} · `);
  const licence = link(p.license,p.licenseUrl,'',true);
  const sep = document.createTextNode(' · ');
  const origin = link('Wikimedia Commons ↗',p.page,'',true);
  $('photo-credit').append(copyright,licence,sep,origin);
  let active = true;
  img.onerror = () => {
    if (!active) return;
    active = false;
    img.onerror = null;
    img.src = museum.fallback;
    text('photo-credit',UI[lang].fallback);
  };
  img.src = p.url;
}
function renderSelector() {
  const root=$('museum-selector');root.replaceChildren();root.setAttribute('aria-label',UI[lang].selector);
  museums.forEach((museum,i)=>{
    const button=el('button','museum-choice'+(index===i?' selected':''),local(museum.name));
    button.type='button';button.setAttribute('aria-current',index===i?'step':'false');
    button.addEventListener('click',()=>{index=i;render();});
    root.append(button);
  });
}
function renderPortal() {
  const u=UI[lang];
  text('portal-eyebrow',u.portalEyebrow);text('portal-heading',u.portalTitle);text('portal-description',u.portalIntro);
  ['artworks','immersive','knowledge','history'].forEach((name,i)=>{
    const button=$('tab-'+name);button.textContent=name==='history'?HISTORY_UI[lang].tab:u.portalTabs[i];
    button.setAttribute('aria-selected',String(activeTab===name));button.tabIndex=activeTab===name?0:-1;
    $('pane-'+name).hidden=activeTab!==name;
  });
  text('artworks-description',u.artworksDescription);text('experiences-description',u.experiencesDescription);
  text('knowledge-heading',u.knowledgeTitle);text('knowledge-description',u.knowledgeDescription);
  text('knowledge-semantic',u.semanticOpen);$('knowledge-semantic').href=`semantic/?lang=${lang}`;
  text('knowledge-note',u.knowledgeNote);
  text('model-caption',u.museumPreview);
  text('history-title',HISTORY_UI[lang].title);
  text('history-intro',HISTORY_UI[lang].intro);
}
function renderKnowledge(museum) {
  const root=$('learning-questions');root.replaceChildren();text('copy-status','');
  (museum.questions||[]).forEach((item,i)=>{
    const block=el('div','learning-question');
    const question=el('p','',`${i+1}. ${local(item)}`);
    const copy=el('button','copy-question',UI[lang].copyQuestion);
    copy.type='button';
    copy.addEventListener('click',async()=>{
      try {await navigator.clipboard.writeText(local(item));text('copy-status',UI[lang].copied);}
      catch(error) {text('copy-status',UI[lang].copyFailed);}
    });
    block.append(question,copy);root.append(block);
  });
}
function setTab(tab,focus=false) {
  if(!['artworks','immersive','knowledge','history'].includes(tab))return;
  activeTab=tab;renderPortal();
  const url=new URL(location.href);url.searchParams.set('tab',tab);
  history.replaceState(null,'',url.pathname+url.search+url.hash);
  if(focus)$('tab-'+tab).focus();
}
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>setTab(button.dataset.tab)));
$('portal-tabs').addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const names=['artworks','immersive','knowledge','history'];let i=names.indexOf(activeTab);
  if(event.key==='Home')i=0;else if(event.key==='End')i=names.length-1;
  else i=(i+(event.key==='ArrowRight'?(lang==='ar'?-1:1):(lang==='ar'?1:-1))+names.length)%names.length;
  setTab(names[i],true);
});

function renderHistory(museum){
  const root=$('history-timeline');root.replaceChildren();
  const milestones=historyByMuseum[museum.id]||[];
  if(!milestones.length){root.append(el('li','history-empty',HISTORY_UI[lang].unavailable));return;}
  milestones.forEach(item=>{
    const li=el('li','history-milestone');
    li.append(el('div','history-date',item.year),el('p','history-text',local(item.text)));
    li.append(link(HISTORY_UI[lang].source,item.source,'history-source',true));
    root.append(li);
  });
}
function renderFacts(museum) {
  const root = $('facts');
  root.replaceChildren();
  museum.facts.forEach((fact, i) => {
    const block = el('article','fact');
    block.append(el('span','fact-number',String(i+1).padStart(2,'0')));
    block.append(el('h3','',local(fact.title)));
    block.append(el('p','',local(fact.body)));
    block.append(link(UI[lang].source,fact.source,'fact-source',true));
    root.append(block);
  });
}
function renderArtworks(museum) {
  const root=$('artworks');
  root.replaceChildren();root.classList.add('artwork-grid');
  museum.artworks.forEach(item => {
    const card=link('',internalUrl(item.href),'artwork-card');
    const media=el('span','artwork-thumb');
    if(ARTWORK_IMAGES[item.id]){
      const img=el('img');
      img.src=ARTWORK_IMAGES[item.id];img.loading='lazy';img.decoding='async';img.alt=local(item.title);
      img.addEventListener('error',()=>img.remove(),{once:true});
      media.append(img);
    }
    const caption=el('span','artwork-description');
    caption.append(el('strong','',local(item.title)),el('span','','↗'));
    card.append(media,caption);root.append(card);
  });
}
function renderExperiences(museum) {
  const root=$('experiences');
  root.replaceChildren();
  $('model-preview').src=museum.fallback;
  $('model-preview').alt=UI[lang].museumPreview+' : '+local(museum.name);
  const q=encodeURIComponent(museum.id);
  root.append(link(UI[lang].virtual,internalUrl(`gallery-vr.html?room=museums&museum=${q}`)));
  root.append(link(UI[lang].ar,internalUrl(`ar.html?museum=${q}`)));
  root.append(link(UI[lang].space,internalUrl(`space.html?museum=${q}`)));
}
function render() {
  if (!museums.length) return;
  const museum=museums[index], u=UI[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.title=`${local(museum.name)} — ARTDACI Museum Explorer`;
  text('intro-eyebrow',u.eyebrow);
  text('page-title',u.title);
  text('intro-description',u.intro);
  text('museum-title',local(museum.name));
  text('museum-location',local(museum.location));
  text('artworks-heading',u.artwork);
  text('experiences-heading',u.experience);
  text('keyboard-tip',u.keyboard);
  text('previous',u.prev);
  text('next',u.next);
  text('gallery-link',u.gallery);
  text('semantic-link',u.semantic);
  document.querySelector('.skip').textContent=u.skip;
  document.querySelectorAll('[data-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.lang===lang)));
  const official=$('museum-official');official.textContent=u.official;official.href=museum.official;
  text('photo-index',`${String(index+1).padStart(2,'0')} / ${String(museums.length).padStart(2,'0')}`);
  text('position',`${index+1} / ${museums.length}`);
  $('previous').disabled=index===0;
  $('next').disabled=index===museums.length-1;
  const dots=$('dots');dots.replaceChildren();
  museums.forEach((_,i)=>dots.append(el('span','dot'+(i===index?' active':''))));
  $('gallery-link').href=internalUrl('gallery-vr.html?room=museums');
  $('semantic-link').href=`semantic/?lang=${lang}`;
  $('home-link').href=lang==='fr'?'index-fr.html':lang==='ar'?'index-ar.html':'index.html';
  renderSelector();renderPortal();renderFacts(museum);renderArtworks(museum);renderExperiences(museum);renderKnowledge(museum);renderHistory(museum);renderPhoto(museum);
  replaceState(museum);
  $('museum-stage').setAttribute('aria-busy','false');
}
function navigate(delta) {
  const next=Math.max(0,Math.min(museums.length-1,index+delta));
  if(next===index) return;
  index=next;render();
  // During reading keep the gallery header visible on small screens.
  if(window.scrollY>$('museum-stage').offsetTop+70) $('museum-stage').scrollIntoView({block:'start',behavior:'instant'});
}
$('previous').addEventListener('click',()=>navigate(-1));
$('next').addEventListener('click',()=>navigate(1));
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.lang!==lang){lang=btn.dataset.lang;render();}}));
document.addEventListener('keydown',event=>{
  if(event.altKey||event.metaKey||event.ctrlKey||event.target.closest('button,a,input,select,textarea,[contenteditable]')) return;
  if(event.key==='ArrowRight'){event.preventDefault();navigate(lang==='ar'?-1:1);}
  if(event.key==='ArrowLeft'){event.preventDefault();navigate(lang==='ar'?1:-1);}
});
window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);if(['fr','en','ar'].includes(q.get('lang')))lang=q.get('lang');const n=museums.findIndex(m=>m.id===q.get('museum'));if(n>=0)index=n;if(['artworks','immersive','knowledge','history'].includes(q.get('tab')))activeTab=q.get('tab');render();});

try {
  const response={ok:true,json:async()=>EMBEDDED_MUSEUM_DATA};
  if(!response.ok)throw Error(`Museum data HTTP ${response.status}`);
  const doc=await response.json();
  if(!Array.isArray(doc.museums)||doc.museums.length!==6||doc.museums.some(m=>m.facts?.length!==2||!m.photo?.page))throw Error('Invalid museum dataset');
  museums=doc.museums;
  const chosen=museums.findIndex(m=>m.id===search.get('museum'));
  if(chosen>=0)index=chosen;
  render();
  fetch('content/museums/history-v4.json')
    .then(response=>{if(!response.ok)throw Error('History data unavailable');return response.json();})
    .then(data=>{
      if(data.schemaVersion!=='1.0'||!data.museums||typeof data.museums!=='object')throw Error('Invalid museum history data');
      historyByMuseum=data.museums;renderHistory(museums[index]);
    })
    .catch(error=>console.warn('ARTDACI museum timeline:',error));
} catch(error) {
  console.error('ARTDACI Museum Explorer:',error);
  $('museum-stage').setAttribute('aria-busy','false');
  $('museum-stage').replaceChildren(el('p','load-error',UI[lang].unavailable));
  $('previous').disabled=true;$('next').disabled=true;
}

})().catch(console.error);
</script>
