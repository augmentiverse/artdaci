<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171411" />
    <title>DACIART — VR Gallery</title>
    <link rel="stylesheet" href="styles/gallery-vr.css?v=1" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="gallery-shell">
      <header class="gallery-toolbar">
        <a id="gallery-back" class="gallery-button" href="index.html">Back to collection</a>
        <div>
          <p id="gallery-kicker">Immersive exhibition</p>
          <h1 id="gallery-title">The ARTDACI Gallery</h1>
          <p id="gallery-instructions">Trigger: teleport. A/X: play or pause. B/Y: restart audio. Press a thumbstick to mute.</p>
        </div>
        <button id="enter-gallery-vr" class="gallery-button primary" type="button" disabled>Enter VR Gallery</button>
      </header>

      <aside class="gallery-guide">
        <strong id="gallery-count">Four masterpieces</strong>
        <span id="gallery-status" role="status">Preparing the gallery…</span>
        <div class="gallery-audio-controls" aria-label="Audio guide controls">
          <button id="gallery-audio-toggle" class="gallery-button" type="button">Play audio</button>
          <button id="gallery-audio-restart" class="gallery-button" type="button">Restart</button>
          <button id="gallery-audio-mute" class="gallery-button" type="button">Mute</button>
        </div>
        <nav class="gallery-exit-links" aria-label="Exit gallery links">
          <a id="gallery-exit-link" class="gallery-button" href="index.html">Exit to collection</a>
          <a id="gallery-experiences-link" class="gallery-button" href="space.html?painting=mona-lisa">Individual experiences</a>
        </nav>
      </aside>

      <div id="gallery-stage" aria-label="Virtual gallery containing four paintings"></div>
    </main>

    <script type="module" src="scripts/gallery-vr.js?v=6"></script>
  </body>
</html>
