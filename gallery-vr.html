<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171411" />
    <title>DACIART — VR Gallery</title>
    <link rel="stylesheet" href="styles/gallery-vr.css?v=3" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="gallery-shell">
      <header class="gallery-toolbar">
        <a id="gallery-back" class="gallery-button" href="index.html">Back to collection</a>
        <div>
          <p id="gallery-kicker">Immersive exhibition</p>
          <h1 id="gallery-title">The ARTDACI Gallery</h1>
          <p id="gallery-instructions">Trigger or hand pinch: select and teleport. A/X: play or pause. B/Y: restart audio. Press a thumbstick to mute.</p>
        </div>
        <div class="gallery-toolbar-actions">
          <a id="gallery-language-switch" class="gallery-button" href="gallery-vr.html?lang=fr" lang="fr">Français</a>
          <button id="enter-gallery-vr" class="gallery-button primary" type="button" disabled>Enter VR Gallery</button>
        </div>
      </header>

      <aside class="gallery-guide">
        <strong id="gallery-count">Four masterpieces</strong>
        <span id="gallery-status" role="status">Preparing the gallery…</span>
        <div class="gallery-audio-controls" aria-label="Audio guide controls">
          <button id="gallery-audio-toggle" class="gallery-button" type="button">Play audio</button>
          <button id="gallery-audio-restart" class="gallery-button" type="button">Restart</button>
          <button id="gallery-audio-mute" class="gallery-button" type="button">Mute</button>
        </div>
        <div class="gallery-video-controls" aria-label="Video controls">
          <select id="gallery-video-select" class="gallery-video-select" aria-label="Choose a cinema video" disabled></select>
          <button id="gallery-video-previous" class="gallery-button" type="button" disabled>Previous</button>
          <button id="gallery-video-toggle" class="gallery-button" type="button" disabled>Play video</button>
          <button id="gallery-video-restart" class="gallery-button" type="button" disabled>Restart video</button>
          <button id="gallery-video-mute" class="gallery-button" type="button" disabled>Unmute video</button>
          <button id="gallery-video-back" class="gallery-button" type="button" disabled>−10 sec</button>
          <button id="gallery-video-forward" class="gallery-button" type="button" disabled>+10 sec</button>
          <button id="gallery-video-next" class="gallery-button" type="button" disabled>Next</button>
        </div>
        <nav class="gallery-exit-links" aria-label="Exit gallery links">
          <a id="gallery-bedroom-world-link" class="gallery-button bedroom-world-link" href="https://marble.worldlabs.ai/worldvr/48b7eb17-56e4-4873-a253-fa13ed516fae">Visit The Bedroom VR World</a>
          <a id="gallery-exit-link" class="gallery-button" href="index.html">Exit to collection</a>
          <a id="gallery-experiences-link" class="gallery-button" href="space.html?painting=mona-lisa">Individual experiences</a>
        </nav>
      </aside>

      <div id="gallery-stage" aria-label="Virtual gallery containing four paintings"></div>
    </main>

  <script type="module" src="scripts/gallery-vr.js?v=32"></script>
  </body>
</html>
