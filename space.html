<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171310" />
    <title>DACIART - Place in My Space</title>
    <link rel="stylesheet" href="styles/space.css?v=18" />
    <link rel="stylesheet" href="styles/visitor-guide.css?v=1" />
    <script type="module" src="vendor/model-viewer.min.js?v=3.5.0"></script>
  </head>
  <body>
    <main
      class="space-shell"
      data-artwork-media-for="vermeer-girl-with-a-pearl-earring"
      data-artwork-media-id="ve01"
      data-artwork-media-manifest-url="https://media.artdaci.com/artworks/ve01/manifest.json"
      data-artwork-media-poster-key="images.main"
      data-artwork-media-model-keys='{"portrait":"models.portrait","sitting":"models.sitting"}'
      data-artwork-media-audio-keys='{"en":"audio.guide.en","fr":"audio.guide.fr","ar":"audio.guide.fr"}'
    >
      <div
        hidden
        data-artwork-media-for="van-gogh"
        data-artwork-media-id="vg01"
        data-artwork-media-manifest-url="https://media.artdaci.com/artworks/vg01/manifest.json"
        data-artwork-media-poster-key="images.main"
        data-artwork-media-model-keys='{"portrait":"models.portrait","standing":"models.standing","bedroom-standing":"models.bedroom-standing"}'
        data-artwork-media-audio-keys='{"en":"audio.overview.en","fr":"audio.overview.fr","ar":"audio.overview.fr"}'
      ></div>
      <header class="space-header">
        <a id="back-link" class="button" href="index.html">Back</a>
        <div>
          <p id="space-kicker" class="eyebrow">Room Placement</p>
          <h1 id="space-title">Artwork</h1>
          <p id="space-copy">Place the 3D model in your space, then move, rotate, and scale it with your device's AR controls.</p>
        </div>
      </header>

      <model-viewer
        id="space-model"
        camera-controls
        touch-action="pan-y"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        shadow-intensity="0.65"
        exposure="1"
        loading="eager"
        reveal="auto">
        <button id="ar-button" class="button primary ar-button" slot="ar-button" type="button">Place in My Space</button>
      </model-viewer>

      <section class="space-panel" aria-live="polite">
        <p id="space-status">Loading model...</p>
        <div class="actions">
          <a id="vr-link" class="button primary" href="vr.html">Open in VR headset</a>
          <a id="vr-gallery-link" class="button" href="gallery-vr.html">Visit VR Gallery</a>
          <a id="image-ar-link" class="button" href="ar.html">Image AR</a>
          <a id="print-link" class="button" href="index.html">Printed Page</a>
        </div>
        <p id="ios-note" class="note" hidden>Spatial AR is available when the model has a compatible AR file for this device.</p>
      </section>
    </main>

    <script type="module" src="scripts/space-viewer.js?v=31"></script>
    <script type="module" src="scripts/visitor-guide.js?v=1"></script>
  </body>
</html>
