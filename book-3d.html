<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17120e" />
    <title>ARTDACI — The Living 3D Book</title>
    <link rel="stylesheet" href="styles/book-3d.css?v=9" />
    <link rel="stylesheet" href="styles/visitor-guide.css?v=1" />
  </head>
  <body>
    <header class="book-toolbar">
      <a class="book-back" href="index.html">Back to collection</a>
      <img class="book-logo" src="assets/varia/artdaci-logo.png" alt="ARTDACI" />
      <div>
        <p>Interactive art book</p>
        <h1>The Living Book</h1>
      </div>
      <div class="book-toolbar-actions">
        <button id="book-prev" type="button" aria-label="Previous page">← Previous</button>
        <span id="book-progress" aria-live="polite">Cover</span>
        <button id="book-next" type="button" aria-label="Next page">Next →</button>
        <button id="book-zoom" type="button" aria-pressed="false">A+ Enlarge</button>
      </div>
    </header>

    <main class="book-stage">
      <p class="book-hint">Click a page, swipe, pinch, or use the arrow keys to turn it. Select a glowing hotspot for immersive content.</p>
      <section id="book" class="book" aria-label="Interactive three-dimensional art book">
        <div class="book-cover-base book-cover-left"></div>
        <div class="book-cover-base book-cover-right"></div>
        <div id="book-sheets" class="book-sheets"></div>
        <div class="book-spine" aria-hidden="true"></div>
      </section>
    </main>

    <dialog id="book-experience" class="book-experience">
      <div class="experience-header">
        <div>
          <p id="experience-kicker">Immersive layer</p>
          <h2 id="experience-title">Experience</h2>
        </div>
        <button id="experience-close" type="button">Return to book ✕</button>
      </div>
      <div id="experience-body" class="experience-body"></div>
    </dialog>

    <script type="module" src="scripts/book-3d.js?v=26"></script>
    <script type="module" src="scripts/visitor-guide.js?v=1"></script>
  </body>
</html>
