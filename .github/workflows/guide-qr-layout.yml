name: Validate ARTDACI guide and QR layout

on:
  pull_request:
    paths:
      - "atlas.html"
      - "atlas-en.html"
      - "atlas-ar.html"
      - "print-multimedia-qr-fr.html"
      - "print-multimedia-qr.html"
      - "styles/atlas-guide-cta.css"
      - "styles/qr-directory-brand.css"
      - "tests/guide-qr-page-quality.test.mjs"
      - "scripts/check-guide-qr-layout.mjs"
      - ".github/workflows/guide-qr-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-qr-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check QR header structure and accessible multilingual Atlas links
        run: |
          node --check scripts/check-guide-qr-layout.mjs
          node --test tests/guide-qr-page-quality.test.mjs
      - name: Install isolated browser dependency and run local server
        run: |
          npm install --prefix /tmp/artdaci-guide-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/artdaci-guide-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl -fsSI http://127.0.0.1:8765/atlas.html; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8765/print-multimedia-qr-fr.html
      - name: Verify QR and Guide geometry on desktop, mobile and print
        env:
          ARTDACI_PLAYWRIGHT_CORE: /tmp/artdaci-guide-qa/node_modules/playwright-core
        run: |
          node scripts/check-guide-qr-layout.mjs \
            --output visual-review/guide-qr-layout.json \
            --screenshots visual-review/guide-qr-screenshots
      - name: Upload layout report and screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artdaci-guide-qr-visual-review
          path: visual-review/
          retention-days: 7
          if-no-files-found: warn
