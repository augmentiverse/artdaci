<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTDACI GEO · Des lieux aux tableaux</title>
<meta name="description" content="Explorez les liens documentés entre les lieux associés aux œuvres, les artistes et leurs musées dans ARTDACI.">
<style>
:root{color-scheme:dark;--bg:#111d28;--panel:#1d2e3d;--text:#f2eee4;--muted:#c4cdd0;--gold:#e4bd7b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#132230,#0c141d);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:1120px;padding:28px 22px 70px;margin:auto}a{color:var(--gold)}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}nav{display:flex;gap:10px;flex-wrap:wrap}
nav a{padding:8px 12px;border:1px solid #54606b;border-radius:20px;text-decoration:none}
h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.14;margin:40px 0 16px}h2{font-size:1.2rem;margin:0 0 8px}.intro{color:var(--muted);max-width:800px}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 18px}
label{display:grid;gap:6px;min-width:240px}select{min-height:45px;padding:10px;border:1px solid #73818c;border-radius:10px;color:var(--text);background:#20374a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px}.card{background:var(--panel);border:1px solid #445665;border-radius:17px;padding:24px}
.kicker{font-size:.83rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:0 0 7px}
.step{margin:14px 0;padding:10px 0;border-top:1px solid #405464}.step strong{display:block;color:var(--gold)}.step span{display:block}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.actions a{display:inline-flex;align-items:center;border:1px solid #ac916e;border-radius:8px;padding:9px 11px;min-height:42px;text-decoration:none;font-size:.88rem}
.actions a:first-child{background:var(--gold);color:#17202a;font-weight:700}.notice{border-left:3px solid var(--gold);padding:14px 18px;background:#213747;margin:24px 0}
.visual{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin:22px 0}.visual-panel{background:#1b2e3d;border:1px solid #445665;border-radius:16px;padding:20px}.visual-panel h2{margin:0 0 15px}.timeline{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;padding:14px 0}.timeline-event{flex:1 0 150px;border-top:3px solid var(--gold);padding:10px 6px}.timeline-event b{display:block;color:var(--gold)}.timeline-event span{font-size:.87rem;color:var(--muted)}.compare-table{width:100%;border-collapse:collapse;font-size:.9rem}.compare-table th,.compare-table td{text-align:start;border-bottom:1px solid #53616d;padding:9px}.compare-table th{color:var(--gold)}.photo{margin:14px 0 4px}.photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#31404d}.photo figcaption{font-size:.77rem;color:var(--muted);margin-top:8px}.photo figcaption a{color:var(--gold)}.related{padding:11px 0;border-top:1px solid #445665}.related h3{margin:0 0 7px;font-size:1rem}.related p{margin:0;color:var(--muted);font-size:.85rem}footer{color:var(--muted);font-size:.85rem;margin-top:32px}@media(max-width:520px){main{padding:18px 14px 50px}nav a{padding:7px}}
</style></head>
<body><main><header><a id="home" href="earth-explorer.html?lang=fr">← ARTDACI GEO</a><nav aria-label="Languages"><a href="?lang=fr" lang="fr">FR</a><a href="?lang=en" lang="en">EN</a><a href="?lang=ar" lang="ar">العربية</a></nav></header>
<h1 id="title"></h1><p id="intro" class="intro"></p><aside id="notice" class="notice"></aside>
<p class="notice"><a id="compare-link" href="geo-artwork-compare.html?lang=fr"></a></p>\n<div class="filters"><label><span id="filter-label"></span><select id="artist-filter"><option value="all"></option></select></label></div>
<section class="visual" aria-label="Visual comparisons"><section class="visual-panel"><h2 id="timeline-heading"></h2><div class="timeline" id="timeline"></div></section><section class="visual-panel"><h2 id="comparison-heading"></h2><div id="comparison"></div></section></section><section class="grid" id="cards" aria-live="polite"></section>
<footer id="footer"></footer></main>
<script>
(async()=>{
const lang=['fr','en','ar'].includes(new URLSearchParams(location.search).get('lang'))?new URLSearchParams(location.search).get('lang'):'fr';
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const t={
fr:{title:'Des lieux aux tableaux',intro:'Découvrez 23 œuvres associées aux 17 musées d’ARTDACI : chronologie, comparaison, photographies sourcées et navigation Semantic. Douze disposent de fiches ARTDACI individuelles ; trois ont également un parcours géographique documenté.',notice:'Important : les onze nouvelles œuvres des musées disposent de dossiers de musée plutôt que de fiches de tableau individuelles vérifiées. Seules trois œuvres ont un parcours géographique documenté ; aucune ligne KML ne représente un transport historique.',filter:'Filtrer par artiste',all:'Tous les artistes',unknown:'Lieu de création non géolocalisé',journey:'Parcours géographique documenté',from:'Lieu et contexte',art:'Tableau',to:'Musée de conservation',work:'Fiche du tableau',research:'Dossier détaillé du musée',museum:'Dossier du musée',source:'Source institutionnelle',download:'Télécharger le KML',error:'Les données des parcours ne sont pas disponibles.',timeline:'Chronologie des œuvres',comparison:'Comparer les approches artistiques',date:'Date',context:'Lecture artistique',photo:'Photographie du musée · Source et licence',semantic:'Explorer dans ARTDACI Semantic',immersive:'Expériences AR / VR / GEO',style:{vg02:'Intérieur et couleur expressive · postimpressionnisme',ve02:'Paysage urbain et lumière · peinture néerlandaise du XVIIe siècle',mo02:'Paysage, lumière et touches visibles · impressionnisme'},footer:'ARTDACI GEO · Sources des lieux et des œuvres accessibles depuis chaque fiche.'},
en:{title:'From places to paintings',intro:'Discover 23 artworks across all 17 ARTDACI museums through timelines, stylistic comparisons, sourced photography and Semantic links. Twelve have individual ARTDACI profiles and three have documented geographic journeys.',notice:'The eleven additional museum works link to museum research dossiers rather than unverified individual painting pages. Only three works have documented geographic links; KML lines do not represent historical transportation.',filter:'Filter by artist',all:'All artists',unknown:'Creation location not geolocated',journey:'Documented geographic journey',from:'Place and context',art:'Painting',to:'Collection museum',work:'Painting profile',research:'Museum research dossier',museum:'Museum dossier',source:'Institutional source',download:'Download KML',error:'Journey data is unavailable.',timeline:'Artwork timeline',comparison:'Compare artistic approaches',date:'Date',context:'Artistic interpretation',photo:'Museum photograph · Source and license',semantic:'Explore in ARTDACI Semantic',immersive:'AR / VR / GEO experiences',style:{vg02:'Interior and expressive colour · Post-Impressionism',ve02:'Cityscape and light · Dutch Golden Age',mo02:'Landscape, light and visible brushwork · Impressionism'},footer:'ARTDACI GEO · Location and artwork sources are linked from each card.'},
ar:{title:'من الأماكن إلى اللوحات',intro:'اكتشف 23 عملاً فنياً في المتاحف السبعة عشر من خلال التسلسل الزمني والمقارنة والصور الموثقة وروابط ARTDACI Semantic. توجد ملفات فردية لاثني عشر عملاً ومسارات جغرافية موثقة لثلاثة أعمال.',notice:'تنبيه: ترتبط الأعمال الإضافية بأبحاث المتاحف بدلاً من صفحات فردية غير مؤكدة. تتوفر مسارات جغرافية موثقة لثلاث لوحات فقط، ولا تمثل خطوط KML مسار النقل التاريخي.',filter:'تصفية حسب الفنان',all:'جميع الفنانين',unknown:'موقع الإنشاء غير محدد جغرافياً',journey:'مسار جغرافي موثق',from:'المكان والسياق',art:'اللوحة',to:'المتحف',work:'ملف اللوحة',research:'ملف المتحف البحثي',museum:'ملف المتحف',source:'المصدر المؤسسي',download:'تنزيل KML',error:'تعذر تحميل بيانات المسارات.',timeline:'التسلسل الزمني للأعمال',comparison:'مقارنة الأساليب الفنية',date:'التاريخ',context:'قراءة فنية',photo:'صورة المتحف · المصدر والترخيص',semantic:'استكشف عبر ARTDACI Semantic',immersive:'تجارب الواقع المعزز والافتراضي',style:{vg02:'الألوان التعبيرية والفضاء الداخلي · ما بعد الانطباعية',ve02:'المدينة والضوء · الفن الهولندي في القرن السابع عشر',mo02:'المناظر الطبيعية والضوء · الانطباعية'},footer:'ARTDACI GEO · روابط المصادر متوفرة في كل بطاقة.'}
}[lang],$=id=>document.getElementById(id);
$('home').href='earth-explorer.html?lang='+lang;$('compare-link').href='geo-artwork-compare.html?lang='+lang;$('compare-link').textContent=({fr:'Comparer visuellement deux ou trois tableaux →',en:'Visually compare two or three artworks →',ar:'مقارنة صورتين أو ثلاث لوحات ←'})[lang];
for(const k of ['title','intro','notice','footer'])$(k).textContent=t[k];
$('timeline-heading').textContent=t.timeline;$('comparison-heading').textContent=t.comparison;$('filter-label').textContent=t.filter;$('artist-filter').firstElementChild.textContent=t.all;
const fetchJson=async p=>{const r=await fetch(p);if(!r.ok)throw Error('HTTP '+r.status);return r.json();};
try{
const [links,geo,places,artworks,atlas,learning,featured]=await Promise.all([fetchJson('geo/data/artwork-context-links.json'),fetchJson('geo/data/museums.json'),fetchJson('geo/data/artist-journeys.json'),fetchJson('geo/data/artworks.json'),fetchJson('museum-atlas/data/museums.json'),fetchJson('geo/data/artwork-learning.json'),fetchJson('geo/data/museum-featured-artworks.json')]);
const museums=new Map(geo.museums.map(m=>[m.id,m])),cities=new Map(places.events.map(e=>[e.id,e])),photos=new Map(atlas.museums.map(m=>[m.id,m]));
const linkedById=new Map(links.connections.map(x=>[x.id,x]));const list=[...learning.works.map(work=>{const museumId=Object.keys(artworks.museums).find(id=>artworks.museums[id].some(a=>a.id===work.id));return {...work,museum:museumId,geographic:linkedById.get(work.id)||null,profileType:'painting'};}),...featured.works];if(list.length!==23||new Set(list.map(w=>w.id)).size!==23||list.some(x=>!x.museum||!museums.has(x.museum)))throw Error('Incomplete artwork learning registry');
for(const artist of [...new Set(list.map(x=>x.artist))].sort()){const opt=document.createElement('option');opt.value=artist;opt.textContent=artist;$('artist-filter').append(opt);}
const add=(parent,tag,text,klass)=>{const el=document.createElement(tag);el.textContent=text;if(klass)el.className=klass;parent.append(el);return el;};
const anchor=(parent,label,url)=>{const el=document.createElement('a');el.href=url;el.textContent=label;el.target='_blank';el.rel='noopener noreferrer';parent.append(el);};
function render(){
$('cards').replaceChildren();$('timeline').replaceChildren();$('comparison').replaceChildren();
const selected=list.filter(x=>$('artist-filter').value==='all'||x.artist===$('artist-filter').value).sort((a,b)=>a.sortYear-b.sortYear);
const table=document.createElement('table');table.className='compare-table';
const head=document.createElement('thead'),hrow=document.createElement('tr');
for(const v of [t.art,t.date,t.context])add(hrow,'th',v);
head.append(hrow);table.append(head);const tbody=document.createElement('tbody');
for(const x of selected){
 const ev=document.createElement('div');ev.className='timeline-event';add(ev,'b',x.date);const detail=(artworks.museums[x.museum]||[]).find(w=>w.id===x.id);const title=detail?.title||x.title;add(ev,'strong',title[lang]||title.fr);add(ev,'span',x.artist);$('timeline').append(ev);
 const row=document.createElement('tr');add(row,'td',title[lang]||title.fr);add(row,'td',x.date);add(row,'td',x.style[lang]||x.style.fr);tbody.append(row);
}table.append(tbody);$('comparison').append(table);

for(const x of selected){
 const city=x.geographic?cities.get(x.geographic.origin):null,museum=museums.get(x.museum),art=(artworks.museums[x.museum]||[]).find(a=>a.id===x.id);
 if(!museum)continue;const workTitle=art?.title||x.title;
 const card=document.createElement('article');card.className='card';
 add(card,'p',x.artist+' · '+x.date,'kicker');add(card,'h2',(workTitle[lang]||workTitle.fr));
 const stage=(label,value)=>{const div=document.createElement('div');div.className='step';add(div,'strong',label);add(div,'span',value);card.append(div);};
 const record=photos.get(x.museum);const photo=record?.hero;if(photo?.url&&photo?.page&&photo.url.startsWith('https://commons.wikimedia.org/')&&photo.page.startsWith('https://commons.wikimedia.org/')){const fig=document.createElement('figure');fig.className='photo';const img=document.createElement('img');img.src=photo.url;img.loading='lazy';img.alt=museum.name+' — '+(photo.caption||'');fig.append(img);const cap=document.createElement('figcaption');cap.append(document.createTextNode(t.photo+' · '));anchor(cap,'Wikimedia Commons',photo.page);fig.append(cap);card.append(fig);}stage(t.from,city?city.city+', '+city.country:t.unknown);stage(t.art,x.geographic?(x.geographic.explanation[lang]||x.geographic.explanation.fr||x.geographic.explanation.en):x.style[lang]||x.style.fr);stage(t.to,museum.name+', '+museum.city);
 const actions=document.createElement('div');actions.className='actions';
 if(art)anchor(actions,t.work,'https://artdaci.com/'+art.href);else anchor(actions,t.research,museum.profileUrl);
 anchor(actions,t.museum,museum.profileUrl);
 anchor(actions,t.source,x.source);
 anchor(actions,t.semantic,'semantic/index.html?lang='+encodeURIComponent(lang));
 if(art)anchor(actions,t.immersive,'museums.html?lang='+encodeURIComponent(lang)+'&museum='+encodeURIComponent(x.museum)+'&tab=immersive');else anchor(actions,t.download,'geo/museums/'+encodeURIComponent(x.museum)+'.kml');
 if(x.geographic)anchor(actions,t.download,'geo/artdaci-artwork-context-links.kml');
 card.append(actions);$('cards').append(card);
}}
$('artist-filter').addEventListener('change',render);render();
}catch(error){console.error(error);$('cards').textContent=t.error;}
})();
</script></body></html>
