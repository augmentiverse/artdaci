<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ARTDACI Museum XR — virtual museum panoramas, WebXR and institutional Street View links.">
<title>ARTDACI Museum XR</title>
<style>
:root{color-scheme:dark;background:#091722;color:#f3eee4;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}
header,main,footer{max-width:1100px;margin:auto;padding:16px 24px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
a{color:#bfe4e9}nav a{margin-inline-start:12px}h1{font-size:clamp(1.8rem,4vw,3rem);margin:20px 0 8px}p{color:#c7d3da;line-height:1.6}
.viewport{height:clamp(320px,65vh,700px);background:#102734;border:1px solid #506577;border-radius:14px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100%}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.button,button{background:#e4c58e;color:#17202b;border:1px solid #e4c58e;border-radius:8px;padding:11px 15px;min-height:44px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}
.button.secondary,button.secondary{background:#1b3342;color:#e7eef1;border-color:#627887}input{min-height:44px;min-width:210px;border:1px solid #79909e;color:#fff;background:#132a38;border-radius:8px;padding:10px}button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible{outline:3px solid #ffe19a;outline-offset:3px}
#links{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}#links button{font-size:.9rem}
#alternatives{margin:20px 0;padding:15px;border:1px solid #486274;border-radius:12px}
#alternatives h2{font-size:1rem;font-weight:600;margin:0 0 10px}
#alternatives .museum-list{display:flex;flex-wrap:wrap;gap:9px}
#alternatives .museum-list a{font-size:.9rem;border:1px solid #637887;border-radius:7px;padding:9px 11px;text-decoration:none;background:#1b3342;color:#fff}
#alternatives .museum-list a[aria-current=page]{border-color:#e4c58e;color:#ffdfab}
.note{font-size:.85rem}#status{min-height:2em}#attribution{padding:10px 0}#attribution a{margin-inline-start:10px}
[dir=rtl] header,[dir=rtl] main{text-align:right}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body><header><a href="index.html" id="back">← ARTDACI GEO</a><nav aria-label="Language"><a href="?lang=fr" data-lang="fr">FR</a><a href="?lang=en" data-lang="en">EN</a><a href="?lang=ar" data-lang="ar">العربية</a></nav></header>
<main><p>ARTDACI GEO · MUSEUM XR</p><h1 id="title">Musées en réalité virtuelle</h1><p id="intro"></p>
<div class="viewport"><canvas id="xr-canvas" aria-label="Vue panoramique immersive" tabindex="0"></canvas></div>
<div class="tools"><button id="start">Charger le panorama</button><button id="demo" class="secondary">Tester Street View 360° (vue non vérifiée)</button><button id="enter-vr" disabled>Entrer en VR</button><button id="reset" class="secondary">Recentrer</button><a id="official" class="button secondary" target="_blank" rel="noopener noreferrer" hidden>Visite officielle ↗</a></div>
<p class="note" id="preview-note">Prévisualisation privée protégée par Vercel. Aucun code supplémentaire nécessaire.</p>
<p id="status" role="status" aria-live="polite"></p><div id="links" aria-label="Adjacent panoramas"></div>
<section id="alternatives" aria-label="Autres musées expérimentaux"><h2 id="alternatives-title">Autres musées du pilote</h2><div id="museum-list" class="museum-list"></div></section>
<p id="attribution" class="note"></p><p id="disclaimer" class="note"></p>
</main><footer>ARTDACI · Art beyond the frame.</footer>
<script type="module" src="scripts/streetview-xr.js"></script></body></html>
