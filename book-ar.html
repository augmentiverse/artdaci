<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111f2b"/>
<meta name="description" content="ARTDACI Book AR — scanner la couverture pour découvrir des médias en réalité augmentée."/>
<title>ARTDACI — Book AR</title>
<link rel="stylesheet" href="styles/book-ar.css?v=1"/>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/three-addons/"}}
</script>
<script type="module" src="vendor/model-viewer.min.js?v=3.5.0"></script>
</head>
<body>
<main id="book-ar">
  <div id="ar-stage" aria-label="ARTDACI camera and augmented content"></div>
  <header class="bar">
    <a id="home" href="index-fr.html">← <span data-copy="home">Accueil</span></a>
    <strong>ARTDACI <small>BOOK AR V1</small></strong>
    <nav class="languages" aria-label="Languages">
      <a href="book-ar.html?lang=fr" lang="fr">FR</a>
      <a href="book-ar.html?lang=en" lang="en">EN</a>
      <a href="book-ar.html?lang=ar" lang="ar">ع</a>
    </nav>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="intro" class="gate">
    <div class="gate-body">
      <p class="kicker">PRINT · 3D · AR · KNOWLEDGE</p>
      <h1>ARTDACI · <span data-copy="title">Le livre augmenté</span></h1>
      <p data-copy="desc"></p>
      <model-viewer src="assets/environments/gallery/models/artdaci_book3d_v2.glb" camera-controls auto-rotate rotation-per-second="6deg" interaction-prompt="none" loading="lazy" alt="ARTDACI book 3D"></model-viewer>
      <p id="target-warning" class="notice" hidden></p>
      <label id="cover-choice" class="cover-choice" hidden><span data-copy="choose">Choisir la couverture</span><input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp"/></label>
      <p data-copy="help"></p>
      <button id="start" class="primary" type="button" data-copy="start">Activer la caméra</button>
      <p id="error" role="alert" hidden></p>
      <p id="progress" role="status" aria-live="polite"></p>
      <small data-copy="privacy"></small>
    </div>
  </section>
  <section id="controls" class="controls" hidden>
    <div class="choices" id="artist-buttons" role="group" aria-label="Artists">
      <button data-artist="intro" aria-pressed="true" data-copy="intro">Présentation</button>
      <button data-artist="leonardo">Leonardo</button>
      <button data-artist="vermeer">Vermeer</button>
      <button data-artist="vangogh">Van Gogh</button>
      <button data-artist="monet">Monet</button>
    </div>
    <div class="actions">
      <button id="play" type="button" data-copy="video">Lire la vidéo</button>
      <button id="listen" type="button" data-copy="listen">Écouter</button>
      <a id="hub" href="geo/masters-hub.html?lang=fr" data-copy="hub">Hub des Maîtres</a>
      <a id="semantic" href="semantic/?lang=fr" data-copy="semantic">Graphe sémantique</a>
      <a id="living" href="book-3d.html?lang=fr" data-copy="book">Livre vivant</a>
    </div>
    <small data-copy="media"></small>
  </section>
  <video id="media" playsinline webkit-playsinline preload="none" hidden></video>
</main>
<script type="module" src="scripts/book-ar.js?v=1"></script>
</body>
</html>
